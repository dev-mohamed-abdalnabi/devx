name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # يكاشي Flutter SDK و pub-cache معًا، فلا حاجة لـ actions/cache يدوي.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # يدير كاش Gradle بذكاء (يزيل المكرر والقديم) بدل المسارات اليدوية.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # بيانات القرآن والتفسير والخطوط والأذكار: تُجلب مرة واحدة ثم تُكاش.
      # المفتاح مبني على سكربتات الجلب فقط، فلا يتغير عند تعديل أي شيء آخر.
      - name: Restore generated data cache
        id: data
        uses: actions/cache@v4
        with:
          path: |
            assets/data/quran.json
            assets/data/tafsir.json
            assets/data/SOURCES.json
            assets/fonts
            lib/data/azkar.json
          key: data-${{ hashFiles('tool/fetch_data.py', 'tool/fetch_hisn.py', 'tool/subset_fonts.py') }}

      - name: Fetch data and subset fonts (only on cache miss)
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          python3 tool/fetch_data.py & p1=$!
          python3 tool/fetch_hisn.py & p2=$!
          wait $p1 && wait $p2
          pip install fonttools || true
          python3 tool/subset_fonts.py || true

      # مصحف المدينة (تخطيط ١٥ سطرًا + حزمة خطوط QCF): كاش مستقل.
      # فشل الجلب يوقف البناء حتى لا تُنتج نسخة بلا مصحف QCF.
      - name: Restore mushaf cache
        uses: actions/cache@v4
        with:
          path: |
            assets/data/mushaf.json
            assets/qcf
          key: mushaf-${{ hashFiles('tool/fetch_mushaf.py') }}

      - name: Fetch Madani mushaf layout and page fonts
        run: |
          pip install fonttools brotli || true
          python3 tool/fetch_mushaf.py

      # خطوة واحدة بدل: flutter create + desugaring + kotlin + manifest + signing
      - name: Prepare Android project
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter create --no-pub --platforms=android --org com.azkarapp .
          python3 tool/patch_gradle.py
          python3 tool/patch_android.py
          python3 tool/patch_signing.py
          mkdir -p ~/.gradle
          printf 'org.gradle.parallel=true\norg.gradle.caching=true\n' >> ~/.gradle/gradle.properties

      # pub get مرة واحدة فقط (flutter create كان يشغله، وبعده خطوة منفصلة)
      - name: Install dependencies and generate icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Test
        run: flutter test

      - name: Build release APK (ARM64)
        # R8 يحذف كود Android غير المستخدم؛ ملفات المصحف تبقى Offline كما هي.
        run: flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 10)) --split-per-abi --target-platform android-arm64 --shrink

      - name: APK size report
        run: |
          limit=$((20 * 1024 * 1024))
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            size=$(stat -c %s "$f")
            echo "- $(basename "$f"): $(du -h "$f" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$size" -ge "$limit" ]; then
              echo "::warning::$(basename "$f") is above 20 MB ($size bytes)"
            fi
          done

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة تلقائية ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*-release.apk
