name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # يضيف مجلد android الناقص فقط دون المساس بملفاتك الحالية (lib, pubspec.yaml)
      - name: Ensure Android platform files exist
        run: flutter create --platforms=android --org com.azkarapp .

      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          python3 << 'EOF'
          import pathlib

          kts = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')

          if kts.exists():
              path = kts
              content = path.read_text()
              if 'isCoreLibraryDesugaringEnabled' not in content:
                  content = content.replace(
                      'compileOptions {',
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                      1
                  )
              if 'coreLibraryDesugaring(' not in content:
                  if 'dependencies {' in content:
                      content = content.replace(
                          'dependencies {',
                          'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                          1
                      )
                  else:
                      content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              path.write_text(content)
          else:
              path = groovy
              content = path.read_text()
              if 'coreLibraryDesugaringEnabled' not in content:
                  content = content.replace(
                      'compileOptions {',
                      'compileOptions {\n        coreLibraryDesugaringEnabled true',
                      1
                  )
              if 'coreLibraryDesugaring ' not in content:
                  if 'dependencies {' in content:
                      content = content.replace(
                          'dependencies {',
                          "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                          1
                      )
                  else:
                      content += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              path.write_text(content)
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: azkar-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة تلقائية ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
